
<!DOCTYPE html>
<html>
<head>
    <title>MBraun Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: white;
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: lightpink;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        li a {
            display: block;
            color: black;
            padding: 15px;
            text-decoration: none;
        }

        li a:hover {
            background-color: pink;
        }

        p {
            margin: 20px;
            line-height: 1.5;
        }

        /* Slideshow container */
        .slideshow {
            position: relative;
            max-width: 600px;
            height: 400px;
            margin: 30px auto;
            overflow: hidden;
            background-color: white;
        }

        /* Make every image the same size */
        .slide {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slide.active {
            display: block;
        }

        /* Previous and Next buttons */
        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 20px;
            cursor: pointer;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        .prev:hover, .next:hover {
            background-color: black;
        }

        /* Dots below the images */
        .dots {
            margin: 15px;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin: 5px;
            background-color: lightgray;
            border-radius: 50%;
            cursor: pointer;
        }

        .dot.active {
            background-color: hotpink;
        }

        /* Make slideshow fit smaller screens */
        @media (max-width: 650px) {
            .slideshow {
                width: 90%;
                height: 300px;
            }
        }
    </style>
</head>

<h1>Glitch Art</h1>

<p>
    These are my Glitch Art projects. I wanted to put together a series of
    images based on tattoos I have on my body, while distorting them and
    adding color, which is the opposite of what I have on my body.
</p>

<!-- Slideshow -->
<div class="slideshow">

    <img class="slide active"
         src="Monarachbutterfly2222.jpg"
         alt="Butterfly glitch art">

    <img class="slide"
         src="Deathmothswag.jpg"
         alt="Death moth glitch art">

    <img class="slide"
         src="bumble-bee2424242424.png"
         alt="Bumblebee glitch art">

    <button class="prev" onclick="changeSlide(-1)"
            aria-label="Previous image">&#10094;</button>

    <button class="next" onclick="changeSlide(1)"
            aria-label="Next image">&#10095;</button>

</div>

<!-- Navigation dots -->
<div class="dots">
    <span class="dot active" onclick="showSlide(0)"></span>
    <span class="dot" onclick="showSlide(1)"></span>
    <span class="dot" onclick="showSlide(2)"></span>
</div>

<script>
    let currentSlide = 0;

    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");

    function showSlide(index) {
        slides[currentSlide].classList.remove("active");
        dots[currentSlide].classList.remove("active");

        currentSlide = (index + slides.length) % slides.length;

        slides[currentSlide].classList.add("active");
        dots[currentSlide].classList.add("active");
    }

    function changeSlide(direction) {
        showSlide(currentSlide + direction);
    }
</script>

</body>
</html>
