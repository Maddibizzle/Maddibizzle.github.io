<!DOCTYPE html>
  <title>Lost in Space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* Remove all page margins */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Fill the entire screen */
    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      color: white;
      text-align: center;
    }

    .container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom-left {
      position: absolute;
      bottom: 16px;
      left: 16px;
    }

    .top-left {
      position: absolute;
      top: 16px;
      left: 16px;
    }

    .top-right {
      position: absolute;
      top: 16px;
      right: 16px;
    }

    .bottom-right {
      position: absolute;
      bottom: 16px;
      right: 16px;
    }

    .centered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Link styling */
    a {
      color: white;
      text-decoration: none;
      cursor: pointer;
      z-index: 1;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Keep text above the image */
    .bottom-left,
    .bottom-right,
    .centered,
    .top-left,
    .top-right {
      z-index: 1;
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      src="https://starwalk.space/gallery/images/what-is-space/1360x765.jpg"
      alt="Space"
    >

    <a href="left.html">
      <div class="bottom-left">Look Left</div>
    </a>

    <a href="right.html">
      <div class="bottom-right">Look Right</div>
    </a>

    <div class="centered">Where are we? You seem to find yourself in the middle of space and you do not seem to know why.</div>

  </div>

</body>
</html>
